# ==============================================================================
# Production Configuration (Cloud Hosting: Render, Railway, Fly.io, AWS, Heroku)
# ==============================================================================

# Dynamic Port assigned by Cloud Host (Render/Railway/Heroku/Fly.io inject PORT env)
server.port=${PORT:8080}

# Cloud Datasource (MySQL or PostgreSQL or Supabase or Neon or Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./database/college_event_db;NON_KEYWORDS=USER;AUTO_SERVER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Initialization (data.sql / schema.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
