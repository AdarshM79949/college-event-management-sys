# ===================================================================
# Application Configuration - CampusPulse Pure Java Desktop System
# ===================================================================
spring.application.name=college-event-management-system
spring.main.web-application-type=none

# ===================================================================
# Database Configuration (Persistent SQL Database with H2/MySQL)
# ===================================================================
# Persistent SQL Database Engine
spring.datasource.url=jdbc:h2:file:./database/college_event_db;NON_KEYWORDS=USER;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA & SQL Initialization Settings (Loads data.sql into Database)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
