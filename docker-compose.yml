version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: campuspulse_mysql
    restart: always
    environment:
      MYSQL_DATABASE: college_event_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_secure_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema_and_mock_data.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CampusPulse Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuspulse_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/college_event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: campus_user
      SPRING_DATASOURCE_PASSWORD: campus_secure_pass_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    ports:
      - "8080:8080"

volumes:
  mysql_data:
